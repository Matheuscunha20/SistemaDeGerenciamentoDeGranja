# Configuração do AgroArca no Render (plano grátis), usada como "Blueprint".
# O banco fica no TiDB Cloud (compatível com MySQL). A conexão é colada no painel do Render
# na hora de criar (não fica no GitHub).
services:
  - type: web
    name: agroarca
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /saude
    # Só publica depois que os testes do GitHub passarem
    autoDeployTrigger: checksPass
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: PORT
        value: "8080"
      - key: Proxy__ConfiarEmCabecalhos
        value: "true"
      - key: Email__Servidor
        sync: false
      - key: Email__Usuario
        sync: false
      - key: Email__Senha
        sync: false
      - key: Email__Remetente
        sync: false
