# Compila o projeto e roda os testes a cada push e pull request
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar pacotes
        run: dotnet restore SistemaGranjaSol.sln

      - name: Compilar
        run: dotnet build SistemaGranjaSol.sln --configuration Release --no-restore

      - name: Rodar os testes
        run: dotnet test SistemaGranjaSol.sln --configuration Release --no-build --verbosity normal

  # Monta a imagem Docker e sobe o AgroArca de verdade com MySQL:
  # confere se o banco é criado (migrations) e se as páginas principais abrem
  sistema-no-ar:
    runs-on: ubuntu-latest
    needs: build-e-testes

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Subir AgroArca + MySQL
        run: |
          cp .env.example .env
          docker compose -f docker-compose.producao.yml up -d --build

      - name: Esperar o sistema ficar no ar (/saude)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/saude; then echo; echo "No ar!"; exit 0; fi
            sleep 3
          done
          echo "O sistema não ficou no ar a tempo."
          exit 1

      - name: Conferir páginas principais
        run: |
          for pagina in / /Identity/Account/Login /Identity/Account/Register /Identity/Account/ForgotPassword /manifest.json /offline.html; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$pagina")
            echo "$pagina -> $codigo"
            [ "$codigo" = "200" ] || exit 1
          done
          codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/pagina-que-nao-existe)
          echo "/pagina-que-nao-existe -> $codigo"
          [ "$codigo" = "404" ] || exit 1
          curl -sI http://localhost:8080/Identity/Account/Login | grep -i "x-content-type-options: nosniff"

      - name: Mostrar o log do sistema
        if: always()
        run: docker compose -f docker-compose.producao.yml logs app | tail -n 80

      - name: Conferir os arquivos do servidor (Caddy e compose)
        run: |
          DOMINIO=exemplo.com.br MYSQL_ROOT_PASSWORD=x MYSQL_PASSWORD=y \
            docker compose -f deploy/docker-compose.servidor.yml config --quiet
          docker run --rm -e DOMINIO=exemplo.com.br \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          bash -n deploy/preparar-servidor.sh
